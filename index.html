<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="calculator">
        <p class="output"></p>
        <div class="firstRow">
            <button class="ac control">AC</button>
            <button class="multiply grey operator">*</button>
            <button class="divide grey operator">/</button>
            <button class="backspace grey control"> Del</button>
        </div>
        <div class="secondRow">
            <button class="seven number">7</button>
            <button class="eight number">8</button>
            <button class="nine number">9</button>
            <button class="substract grey operator">-</button>
        </div>
        <div class="middleRows">
            <div class="left">
                <div class="leftFirst">
                    <button class="four number">4</button>
                    <button class="five number">5</button>
                    <button class="six number">6</button>
                </div>
                <div class="leftSecond">
                    <button class="one number">1</button>
                    <button class="two number">2</button>
                    <button class="three number">3</button>
                </div>
            </div>
            <div class="right">
                <button class="plus grey operator" id="plus">+</button>
            </div>
        </div>
        <div class="buttom">
            <button class="zero grey number" id="zero">0</button>
            <button class="virgule grey control">.</button>
            <button class="equal control">=</button>
        </div>


    </div>
</body>
<script src="./script.js"></script>

</html>
